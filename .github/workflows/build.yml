name: Test and build Debian package

on: [push, pull_request]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Install Perl cryptography dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libcryptx-perl
      - name: Test backend and packaging integration
        run: |
          prove -I src tests/*.t
          perl scripts/test-package-integration.pl
      - name: Check frontend syntax
        run: |
          node --check src/ui/easy-actions.js
      - name: Build and inspect package
        run: |
          bash scripts/build-deb.sh
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb
          cd dist
          sha256sum *.deb > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: proxmox-easy-actions-deb
          path: dist/
          if-no-files-found: error
